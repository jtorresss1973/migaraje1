<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{color-scheme:light;--bg:#f2f4f7;--surface:#ffffff;--surface-2:#f7f9fb;--hover:#eef2f7;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb;--accent-fg:#ffffff;--accent-soft:#e0ebff;--danger:#dc2626;--ok:#059669;--warn:#d97706;--radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.05);}
html[data-theme="dark"]{color-scheme:dark;--bg:#0b0f14;--surface:#141a21;--surface-2:#1a222b;--hover:#1f2933;--text:#e6edf3;--muted:#8b98a5;--border:#242e39;--accent:#4c8dff;--accent-fg:#08111f;--accent-soft:#1b2b45;--danger:#ff6b6b;--ok:#34d399;--warn:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25}h2{font-size:1.35rem}h3{font-size:1.05rem}p{margin:0}a{color:var(--accent)}.muted{color:var(--muted);font-size:.85rem}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top));z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:1.02rem}
.brand .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),#8b5cf6);color:#fff}
.brand .logo .ic{width:19px;height:19px;stroke-width:2}.topbar .spacer{flex:1}
.vselect{max-width:230px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 12px;font:inherit;font-size:.85rem;font-weight:600}
.main{flex:1;min-height:0;display:flex;width:100%;overflow:hidden}
.sidebar{width:228px;flex:0 0 228px;padding:14px 10px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;transition:background .12s,color .12s}
.navlink:hover{background:var(--hover);color:var(--text)}.navlink.active{background:var(--accent-soft);color:var(--accent)}
.content{flex:1;min-width:0;min-height:0;padding:18px;max-width:1500px;margin:0 auto;width:100%;display:flex;flex-direction:column;overflow:hidden}
.content>.viewhead,.content>.toolbar{flex:0 0 auto}
.scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:6px}
.scroll-area>*:last-child{margin-bottom:0}.bottomnav{display:none}.fab{display:none}
@media(max-width:900px){.sidebar{display:none}.content{padding:12px}
.bottomnav{display:flex;flex:0 0 auto;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 7px;border:0;background:none;color:var(--muted);font-family:inherit;font-size:.57rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden}
.bottomnav button span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bottomnav button.active{color:var(--accent)}.bottomnav .ic{width:19px;height:19px}
.fab{display:grid;place-items:center;position:fixed;z-index:46;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
body[data-view="vehicles"] .fab,body[data-view="data"] .fab{display:none}}
.viewhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.viewhead .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:9px 14px;font:inherit;font-weight:600;font-size:.87rem;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--border)}
.btn.icon{padding:9px;border-radius:9px}.btn.sm{padding:7px 11px;font-size:.8rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{padding:14px 20px;font-size:1rem}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .value{font-size:1.4rem;font-weight:800;margin-top:5px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .sub{font-size:.74rem;color:var(--muted);margin-top:3px}
.kpi.accent .value{color:var(--accent)}.kpi.ok .value{color:var(--ok)}.kpi.warn .value{color:var(--warn)}.kpi.danger .value{color:var(--danger)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:180px;max-width:380px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{padding-left:34px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.865rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.actions{text-align:right;white-space:nowrap}td .rowbtns{display:inline-flex;gap:4px}
.mini{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;text-decoration:none}
.mini:hover{background:var(--hover);color:var(--text)}.mini.del:hover{color:var(--danger)}.mini.has{color:var(--accent);background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.tag .ic{width:12px;height:12px;stroke-width:2.2}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.tag.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
@media(max-width:860px){.tablewrap{border:0;background:transparent;box-shadow:none;overflow:visible}
table{display:block}thead{display:none}tbody{display:block}
tbody tr{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:4px 0;box-shadow:var(--shadow)}
tbody tr:hover{background:var(--surface)}
tbody td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border:0;padding:6px 14px;white-space:normal;text-align:right}
tbody td::before{content:attr(data-label);color:var(--muted);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto;text-align:left}
tbody td.num{text-align:right}
tbody td.actions{justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
tbody td.actions::before{display:none}tbody td:empty{display:none}}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 2px 2px;font-size:.8rem;color:var(--muted)}
.pagecontrols{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pagebtn{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-grid;place-items:center;transition:.12s}
.pagebtn:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}
.pagebtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pagebtn:disabled{opacity:.35;cursor:not-allowed}.pagegap{padding:0 3px;color:var(--muted)}
@media(max-width:600px){.pageinfo{width:100%;text-align:center;order:2}.pagecontrols{width:100%;justify-content:center;order:1}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;min-width:0}
.field>label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.field .hint{font-size:.72rem;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.formgrid .full{grid-column:1/-1}
@media(max-width:520px){.formgrid{grid-template-columns:1fr}}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font:inherit;font-size:.9rem;transition:border-color .12s,box-shadow .12s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}input[type="checkbox"]{width:auto;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;cursor:pointer}
.check input{flex:0 0 auto}.filebox{display:flex;flex-wrap:wrap;gap:8px}
.filechip{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;max-width:100%;width:100%}
.filechip img{width:46px;height:46px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:var(--surface)}
.filechip .fileicon{width:46px;height:46px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--accent);flex:0 0 auto}
.filechip .fileicon .ic{width:22px;height:22px}
.filemeta{min-width:0;display:flex;flex-direction:column;flex:1}
.filemeta b{font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filemeta span{font-size:.7rem}
.vcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.vcard .top{display:flex;gap:12px;align-items:flex-start}
.vcard .avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.vcard .avatar .ic{width:24px;height:24px}
.vcard .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.82rem;margin:0}
.vcard .meta dt{color:var(--muted);font-weight:700}.vcard .meta dd{margin:0;overflow-wrap:anywhere}
.vcard .stats{display:flex;gap:14px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);font-size:.78rem}
.vcard .stats b{display:block;font-size:.95rem}
.vphoto{height:155px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border)}
.vphoto img{width:100%;height:100%;object-fit:cover;display:block}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--surface-2)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.importlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.importlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem}
.importlist .ic{color:var(--accent)}.divider{height:1px;background:var(--border);margin:16px 0}
.bar{height:9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
kbd{background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:.78rem;font-family:ui-monospace,monospace}
.folderbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.folderbox .ic{color:var(--accent);width:22px;height:22px}
.folderbox .finfo{flex:1;min-width:0}
.folderbox .finfo b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderbox .finfo span{font-size:.75rem;color:var(--muted)}
.badge-support{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
@media(min-width:901px){#toasts{bottom:24px}}
.toast{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.86rem;font-weight:600;animation:pop .18s ease-out;max-width:100%}
.toast.ok{border-left:4px solid var(--ok)}.toast.err{border-left:4px solid var(--danger)}.toast.info{border-left:4px solid var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.9rem}
.empty .ic{width:38px;height:38px;margin:0 auto 10px;opacity:.4}
#modal-root{display:none}#modal-root.open{display:block}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(8,12,18,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:660px;max-height:90dvh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{flex:1;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-body{padding:18px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.chartbox{overflow-x:auto;padding-bottom:4px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.83rem}
.legend li{display:flex;align-items:center;gap:9px}.legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.donutwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.donutwrap .legend{flex:1;min-width:170px}
.jsonarea{width:100%;font-family:ui-monospace,monospace;font-size:.72rem;min-height:160px;resize:vertical}
details.diag{margin-top:12px;font-size:.75rem;color:var(--muted)}
details.diag summary{cursor:pointer;font-weight:700;color:var(--muted);padding:4px 0}
details.diag pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:.7rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
ol.steps{margin:8px 0 0 20px;padding:0;font-size:.85rem}
ol.steps li{margin-bottom:6px}
.warnbox{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;padding:12px;font-size:.85rem;margin-bottom:14px}
.warnbox b{color:var(--accent)}
</style>
</head>

  for (const name of bridgeNames){
    const b = window[name];
    if (!b) continue;
    for (const m of ['downloadFile','saveFile','saveJson','download','writeFile','saveTextFile']){
      if (typeof b[m] === 'function') attempts.push({ name:`${name}.${m}()`, run:()=>{ b[m](filename, data); return true; } });
    }
  }
  if (typeof navigator !== 'undefined' && typeof navigator.share === 'function'){
    attempts.push({ name:'share file', run: async () => {
      const file = new File([data], filename, {type:'application/json'});
      if (navigator.canShare && !navigator.canShare({files:[file]})) throw new Error('canShare false');
      await navigator.share({files:[file], title:filename}); return true;
    }});
    attempts.push({ name:'share text', run: async () => { await navigator.share({title:filename, text:data}); return true; }});
  }
  attempts.push({ name:'a.download blob + MouseEvent', run: () => {
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel='noopener';
    a.style.position='fixed'; a.style.left='-9999px';
    document.body.appendChild(a);
    const ev = new MouseEvent('click', {bubbles:true, cancelable:true, view:window});
    a.dispatchEvent(ev);
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
    return true;
  }});
  attempts.push({ name:'window.open data', run: () => {
    const b64 = btoa(unescape(encodeURIComponent(data)));
    const w = window.open('data:application/octet-stream;base64,' + b64, '_blank');
    if (!w) throw new Error('Bloqueado');
    return true;
  }});
  const failed = [];
  for (const a of attempts){
    try {
      const ok = await a.run();
      if (ok) return {ok:true, method:a.name};
    } catch(e){
      if (e && e.name === 'AbortError') return {ok:true, method:a.name, cancelled:true};
      failed.push(a.name + ': ' + (e && e.message || e));
    }
  }
  return {ok:false, failed};
}
async function copyToClipboard(text){
  try{ if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}

    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

function searchFilter(list,q){if(!q)return list;const s=q.toLowerCase();return list.filter(r=>Object.values(r).some(v=>{if(v&&typeof v==="object")return false;return String(v??"").toLowerCase().includes(s);}));}
function attachBtn(type,id,key){const att=findAttachment(type,id,key);if(!att||!att.data)return`<span class="muted">—</span>`;return`<button class="mini has" data-action="view-att" data-type="${type}" data-id="${id}" data-key="${key}" title="${esc(att.name||"adjunto")}">${icon("clip")}</button>`;}
function tableFuel(){const q=searchTerm.fuel;const all=searchFilter(fuelList(),q).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(Number(b.odometro)||0)-(Number(a.odometro)||0));if(!all.length)return`<div class="empty">${icon("fuel")}<div>${q?"Sin resultados":"Todavía no hay recargas"}</div></div>`;const info=paginate(all,"fuel");const rows=info.items.map(r=>{const cant=Number(r.cantidad)||0,cost=Number(r.coste)||0,dist=Number(r.distancia)||0;const eurL=cant>0?cost/cant:0;const cons=(dist>0&&cant>0)?(cant/dist)*100:0;return`<tr><td data-label="Fecha">${fmtFecha(r.fecha)}${r.parcial?' <span class="tag warn">parcial</span>':""}</td><td class="num" data-label="Odómetro">${r.odometro?fmtInt(r.odometro):"—"}</td><td class="num" data-label="Distancia">${dist?fmtInt(dist):"—"}</td><td class="num" data-label="Litros">${fmtNum(cant,2)}</td><td class="num" data-label="Importe">${money(cost)}</td><td class="num" data-label="€/L">${eurL?fmtNum(eurL,3):"—"}</td><td class="num" data-label="L/100km">${cons?fmtNum(cons,2):"—"}</td><td data-label="Gasolinera">${esc(r.gasolinera||"—")}</td><td class="actions"><span class="rowbtns"><button class="mini" data-action="edit" data-type="fuel" data-id="${r.id}">${icon("edit")}</button><button class="mini del" data-action="del" data-type="fuel" data-id="${r.id}">${icon("trash")}</button></span></td></tr>`;}).join("");return`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th class="num">Odómetro</th><th class="num">Dist.</th><th class="num">Litros</th><th class="num">Importe</th><th class="num">€/L</th><th class="num">L/100</th><th>Gasolinera</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${paginationHTML("fuel",info)}`;}
function tableServices(){const q=searchTerm.services;const all=searchFilter(serviceList(),q).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(Number(b.odometro)||0)-(Number(a.odometro)||0));if(!all.length)return`<div class="empty">${icon("wrench")}<div>${q?"Sin resultados":"Todavía no hay servicios"}</div></div>`;const info=paginate(all,"services");const rows=info.items.map(r=>`<tr><td data-label="Fecha">${fmtFecha(r.fecha)}</td><td class="num" data-label="Odómetro">${r.odometro?fmtInt(r.odometro):"—"}</td><td data-label="Servicio">${esc(r.concepto||"—")}${r.notas?`<div class="muted">${esc(r.notas)}</div>`:""}</td><td data-label="Proveedor">${esc(r.proveedor||"—")}</td><td class="num" data-label="Importe">${money(r.coste)}</td><td data-label="Documento" style="text-align:center">${attachBtn("services",r.id,"documento")}</td><td class="actions"><span class="rowbtns"><button class="mini" data-action="edit" data-type="services" data-id="${r.id}">${icon("edit")}</button><button class="mini del" data-action="del" data-type="services" data-id="${r.id}">${icon("trash")}</button></span></td></tr>`).join("");return`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th class="num">Odómetro</th><th>Servicio</th><th>Proveedor</th><th class="num">Importe</th><th style="text-align:center">Doc.</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${paginationHTML("services",info)}`;}

function tableDocuments(){const q=searchTerm.documents;const all=searchFilter(documentList(),q).sort((a,b)=>{const av=a.vencimiento||"9999",bv=b.vencimiento||"9999";if(av!==bv)return av.localeCompare(bv);return(b.fecha||"").localeCompare(a.fecha||"");});if(!all.length)return`<div class="empty">${icon("file")}<div>${q?"Sin resultados":"Todavía no hay documentos"}</div></div>`;const info=paginate(all,"documents");const rows=info.items.map(r=>{const est=docEstado(r);return`<tr><td data-label="Documento"><span class="tag accent">${icon(docIcono(r.tipo))} ${esc((r.tipo||"").length>26?r.tipo.slice(0,24)+"…":(r.tipo||"—"))}</span>${r.titulo?`<div class="muted" style="margin-top:4px">${esc(r.titulo)}</div>`:""}</td><td data-label="Nº / Ref.">${esc(r.numero||"—")}</td><td data-label="Emisor">${esc(r.emisor||"—")}</td><td data-label="Fecha">${r.fecha?fmtFecha(r.fecha):"—"}</td><td data-label="Vencimiento">${r.vencimiento?fmtFecha(r.vencimiento):"—"}<div><span class="tag ${est.cls}">${esc(est.txt)}</span></div></td><td class="num" data-label="Importe">${Number(r.coste)?money(r.coste):"—"}</td><td data-label="Adjunto" style="text-align:center">${attachBtn("documents",r.id,"archivo")}</td><td class="actions"><span class="rowbtns"><button class="mini" data-action="edit" data-type="documents" data-id="${r.id}">${icon("edit")}</button><button class="mini del" data-action="del" data-type="documents" data-id="${r.id}">${icon("trash")}</button></span></td></tr>`;}).join("");return`<div class="tablewrap"><table><thead><tr><th>Documento</th><th>Nº / Ref.</th><th>Emisor</th><th>Fecha</th><th>Vencimiento</th><th class="num">Importe</th><th style="text-align:center">Adj.</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${paginationHTML("documents",info)}`;}

function listView(type){const meta={fuel:{title:"Recargas",icon:"fuel",btn:"Nueva recarga",ph:"Buscar por gasolinera, fecha, notas…"},services:{title:"Servicios",icon:"wrench",btn:"Nuevo servicio",ph:"Buscar por servicio, proveedor…"},expenses:{title:"Otros gastos",icon:"receipt",btn:"Nuevo gasto",ph:"Buscar por concepto, proveedor…"},documents:{title:"Documentos",icon:"file",btn:"Nuevo documento",ph:"Buscar por tipo, emisor, número…"}}[type];const list={fuel:fuelList,services:serviceList,expenses:expenseList,documents:documentList}[type]();const tot=sumBy(list,"coste");let extra="";if(type==="fuel"){const l=sumBy(list,"cantidad");const km=list.reduce((a,r)=>a+(Number(r.distancia)||0),0);extra=` · ${fmtNum(l,1)} L · ${km>0?fmtNum(l/km*100,2)+" L/100km":"—"}`;}else if(type==="documents"){const cad=list.filter(d=>d.vencimiento&&diasHasta(d.vencimiento)<0).length;extra=cad?` · <span style="color:var(--danger)">${cad} caducado(s)</span>`:"";}return`

function prevOdometro(vehicleId,fecha,odo,excludeId){const all=[...state.fuel.filter(r=>r.vehicleId===vehicleId),...state.services.filter(r=>r.vehicleId===vehicleId)].filter(r=>r.id!==excludeId&&Number(r.odometro)>0).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));let best=0;for(const r of all){const o=Number(r.odometro);if(o<odo&&(r.fecha||"")<=(fecha||"9999"))best=Math.max(best,o);}return best;}

function parseCSV(text){const rows=[];let row=[],field="",inQ=false,i=0;if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);while(i<text.length){const c=text[i];if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;}else{inQ=false;i++;}}else{field+=c;i++;}}else{if(c==='"'){inQ=true;i++;}else if(c===","){row.push(field);field="";i++;}else if(c==="\r"){i++;}else if(c==="\n"){row.push(field);rows.push(row);row=[];field="";i++;}else{field+=c;i++;}}}row.push(field);rows.push(row);return rows.filter(r=>r.some(x=>String(x).trim()!==""));}
const ALIASES={vehicles:{nombre:["vehiculo","nombre","identificacion"],marca:["marca"],modelo:["modelo"],anio:["ano","year"],licencia:["no licencia","licencia","matricula","numero de licencia","placa"],vin:["numero de serie","serie","vin","bastidor","chasis"],poliza:["numero de poliza","poliza"],notas:["notas","observaciones"],especificaciones:["especificaciones","specs"]},fuel:{vehicleName:["vehiculo","nombre"],fecha:["fecha"],odometro:["odometro","kilometraje","km"],distancia:["distancia","recorrido"],cantidad:["cantidad","litros"],coste:["coste total","coste","importe","total"],eficiencia:["eficiencia del combustible","eficiencia","rendimiento"],parcial:["recarga parcial","parcial"],faltaLlenado:["falta llenado","falta"],gasolinera:["gasolinera","estacion","surtidor"],tipoCombustible:["tipo de combustible","combustible"],octanaje:["octanaje"],notas:["notas","observaciones"],recibo:["recibo","comprobante"],tipoRegistro:["tipo de registro"]},services:{vehicleName:["vehiculo","nombre"],fecha:["fecha"],odometro:["odometro","kilometraje"],concepto:["servicios","servicio","descripcion","concepto"],coste:["coste total","coste","importe","total"],proveedor:["proveedor","taller"],notas:["notas","observaciones"],recibo:["recibo","comprobante"]},expenses:{vehicleName:["vehiculo","nombre"],fecha:["fecha"],concepto:["otros gastos","gasto","concepto","descripcion"],coste:["coste total","coste","importe","total"],proveedor:["proveedor"],notas:["notas","observaciones"],recibo:["recibo","comprobante"]}};
function buildIndex(headers,aliasMap){const H=headers.map(norm);const idx={};for(const key in aliasMap){const aliases=aliasMap[key];let found=-1;for(let i=0;i<H.length&&found<0;i++){for(const a of aliases){if(H[i]===a||H[i].startsWith(a)){found=i;break;}}}idx[key]=found;}return idx;}
function detectType(headers){const H=headers.map(norm);const has=x=>H.some(h=>h===x);if(has("marca")||has("modelo")||has("numero de serie"))return"vehicles";if(has("gasolinera")||has("cantidad")||has("distancia")||has("octanaje"))return"fuel";if(has("otros gastos")||has("gasto"))return"expenses";if(has("servicios")||has("servicio"))return"services";if(has("odometro")&&has("proveedor"))return"services";if(has("odometro"))return"fuel";return null;}
function get(row,idx,key){const i=idx[key];return(i===undefined||i<0||i>=row.length)?"":String(row[i]??"").trim();}
function parseFile(text){const rows=parseCSV(text);if(rows.length<2)return{type:null,error:"El archivo está vacío",count:0};const headers=rows[0].map(h=>String(h).replace(/^"|"$/g,"").trim());const type=detectType(headers);if(!type)return{type:null,error:"No se reconoce el tipo de archivo",count:0,headers};const idx=buildIndex(headers,ALIASES[type]);const data=rows.slice(1);if(type==="vehicles"){const out=data.map(r=>({nombre:get(r,idx,"nombre"),marca:get(r,idx,"marca"),modelo:get(r,idx,"modelo"),anio:num(get(r,idx,"anio"))||"",licencia:get(r,idx,"licencia"),vin:get(r,idx,"vin"),poliza:get(r,idx,"poliza"),notas:get(r,idx,"notas"),especificaciones:get(r,idx,"especificaciones"),imagen:null})).filter(v=>v.nombre);return{type,records:out,count:out.length};}const out=data.map(r=>{const base={vehicleName:get(r,idx,"vehicleName"),fecha:parseFecha(get(r,idx,"fecha")),coste:num(get(r,idx,"coste")),notas:get(r,idx,"notas"),recibo:get(r,idx,"recibo")};if(type==="fuel"){return Object.assign(base,{odometro:num(get(r,idx,"odometro"))||"",distancia:num(get(r,idx,"distancia"))||"",cantidad:num(get(r,idx,"cantidad"))||"",gasolinera:get(r,idx,"gasolinera"),tipoCombustible:get(r,idx,"tipoCombustible"),octanaje:num(get(r,idx,"octanaje"))||"",parcial:/^(s[ií]|si|true|1|yes)$/i.test(get(r,idx,"parcial")),faltaLlenado:/^(s[ií]|si|true|1|yes)$/i.test(get(r,idx,"faltaLlenado")),tipoRegistro:get(r,idx,"tipoRegistro")||"Fuel Record"});}if(type==="services"){return Object.assign(base,{odometro:num(get(r,idx,"odometro"))||"",concepto:get(r,idx,"concepto"),proveedor:get(r,idx,"proveedor"),documento:null});}return Object.assign(base,{concepto:get(r,idx,"concepto"),proveedor:get(r,idx,"proveedor"),documento:null});}).filter(r=>r.fecha||r.coste||r.cantidad);return{type,records:out,count:out.length};}
let pendingImport=null;
function readFile(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result));fr.onerror=()=>reject(fr.error);fr.readAsText(file,"UTF-8");});}
async function handleCSVFiles(files){const parsed=[];for(const f of files){try{const text=await readFile(f);const res=parseFile(text);parsed.push({file:f.name,...res});}catch(e){parsed.push({file:f.name,error:"No se pudo leer: "+e.message,count:0});}}pendingImport=parsed;showImportPreview(parsed);}
function showImportPreview(parsed){const names={vehicles:"Vehículos",fuel:"Recargas",services:"Servicios",expenses:"Otros gastos"};const iconNames={vehicles:"car",fuel:"fuel",services:"wrench",expenses:"receipt"};const total=parsed.reduce((a,p)=>a+(p.count||0),0);const items=parsed.map(p=>`<li>${p.error?`<svg class="ic" style="color:var(--danger)"><use href="#i-alert"></use></svg>`:`<svg class="ic"><use href="#i-${iconNames[p.type]||"file"}"></use></svg>`}<div style="flex:1;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis">${esc(p.file)}</div><div class="muted">${p.error?esc(p.error):`${names[p.type]||"?"} · ${p.count} registros`}</div></div></li>`).join("");openModal(`<div class="modal-head">${icon("upload")}<h3>Importar datos</h3><button class="btn icon ghost" data-action="modal-close">${icon("close")}</button></div><div class="modal-body"><p class="muted">Se van a importar <b>${total}</b> registros.</p><ul class="importlist">${items}</ul><label class="check" style="margin-top:14px"><input type="checkbox" id="impDedupe" checked> Omitir duplicados</label></div><div class="modal-foot"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" id="impOk" ${total?"":"disabled"}>${icon("upload")}Importar</button></div>`);$("#impOk").addEventListener("click",async()=>{const dedupe=$("#impDedupe").checked;const res=applyImport(pendingImport,dedupe);pendingImport=null;closeModal();await saveState();render();toast(`Importados ${res.added} registros`+(res.skipped?` · ${res.skipped} duplicados omitidos`:""),"ok",4500);});}
function applyImport(parsed,dedupe){let added=0,skipped=0;const findVehicle=name=>{const n=norm(name);if(!n)return null;let v=state.vehicles.find(x=>norm(x.nombre)===n);if(!v){v={id:uid(),nombre:String(name).trim(),marca:"",modelo:"",anio:"",licencia:"",vin:"",poliza:"",notas:"",especificaciones:"",imagen:null};state.vehicles.push(v);}return v;};const keyOf=(type,r)=>{if(type==="fuel")return`f|${r.vehicleId}|${r.fecha}|${r.coste}|${r.cantidad}|${r.odometro}`;if(type==="services")return`s|${r.vehicleId}|${r.fecha}|${r.coste}|${norm(r.concepto)}`;if(type==="expenses")return`e|${r.vehicleId}|${r.fecha}|${r.coste}|${norm(r.concepto)}`;return"";};const existing=new Set();state.fuel.forEach(r=>existing.add(keyOf("fuel",r)));state.services.forEach(r=>existing.add(keyOf("services",r)));state.expenses.forEach(r=>existing.add(keyOf("expenses",r)));const existingVeh=new Set(state.vehicles.map(v=>norm(v.nombre)));parsed.filter(p=>p.type==="vehicles").forEach(p=>{(p.records||[]).forEach(r=>{const n=norm(r.nombre);if(!n)return;if(dedupe&&existingVeh.has(n)){skipped++;return;}if(!existingVeh.has(n)){state.vehicles.push(Object.assign({id:uid()},r));existingVeh.add(n);added++;}});});["fuel","services","expenses"].forEach(type=>{const coll=state[type];parsed.filter(p=>p.type===type).forEach(p=>{(p.records||[]).forEach(r=>{const v=findVehicle(r.vehicleName)||state.vehicles.find(x=>x.id===state.settings.vehicle)||state.vehicles[0];if(!v)return;const rec=Object.assign({},r,{id:uid(),vehicleId:v.id});delete rec.vehicleName;const k=keyOf(type,rec);if(dedupe&&existing.has(k)){skipped++;return;}existing.add(k);coll.push(rec);added++;});});});return{added,skipped};}

  case"quick-pick":closeModal();openRecordForm(el.dataset.type);break;
  case"new-vehicle":openVehicleForm();break;
  case"edit":openRecordForm(el.dataset.type,el.dataset.id);break;
  case"edit-vehicle":openVehicleForm(el.dataset.id);break;
  case"page":{const t=el.dataset.type;pageState[t]=parseInt(el.dataset.page,10)||1;const host=$("#tableHost");if(host){host.innerHTML=renderListBody(t);host.scrollTop=0;}break;}
  case"pick-file":{const form=el.closest("form");if(!form)break;const input=form.querySelector(`input[data-filekey="${el.dataset.key}"]`);if(input)input.click();break;}
  case"remove-file":{const form=el.closest("form");if(!form)break;const key=el.dataset.key;if(form._attachments)delete form._attachments[key];refreshFileBox(form,key);break;}
  case"view-file":{const form=el.closest("form");if(!form)break;openAttachment((form._attachments||{})[el.dataset.key]);break;}
  case"view-att":openAttachment(findAttachment(el.dataset.type,el.dataset.id,el.dataset.key));break;
  case"del":{const t=el.dataset.type,id=el.dataset.id;const coll={fuel:state.fuel,services:state.services,expenses:state.expenses,documents:state.documents}[t];const rec=coll.find(r=>r.id===id);if(!rec)return;const desc=t==="documents"?(rec.tipo+(rec.titulo?" · "+rec.titulo:"")):`${fmtFecha(rec.fecha)} — ${money(rec.coste)}`;const ok=await askConfirm("Eliminar registro",`¿Eliminar <b>${esc(desc)}</b>?<br><span class="muted">Esta acción no se puede deshacer.</span>`);if(!ok)return;coll.splice(coll.indexOf(rec),1);await saveState();render();toast("Registro eliminado","ok");break;}
  case"del-vehicle":{const id=el.dataset.id;const v=vehById(id);if(!v)return;const n=state.fuel.filter(r=>r.vehicleId===id).length+state.services.filter(r=>r.vehicleId===id).length+state.expenses.filter(r=>r.vehicleId===id).length+state.documents.filter(r=>r.vehicleId===id).length;const ok=await askConfirm("Eliminar vehículo",`¿Eliminar <b>${esc(v.nombre)}</b>?`+(n?`<br><span class="muted">Se eliminarán también sus ${n} registros.</span>`:""));if(!ok)return;state.vehicles=state.vehicles.filter(x=>x.id!==id);state.fuel=state.fuel.filter(r=>r.vehicleId!==id);state.services=state.services.filter(r=>r.vehicleId!==id);state.expenses=state.expenses.filter(r=>r.vehicleId!==id);state.documents=state.documents.filter(r=>r.vehicleId!==id);if(state.settings.vehicle===id)state.settings.vehicle="all";await saveState();render();toast("Vehículo eliminado","ok");break;}
  case"export-csv":exportCSV(el.dataset.type);break;
  case"export-json":exportBackupJSON();break;
  case"import-json":importBackupJSON();break;
  case"pick-backup-file":{const idx=parseInt(el.dataset.index,10);const files=window._backupFileReaders||[];const f=files[idx];if(!f)break;closeModal();try{const text=await f.read();await restoreFromText(f.name,text);}catch(err){toast("Error: "+err.message,"err");}break;}
  case"pick-backup-other":{closeModal();const f=await FSBridge.pickFile();if(!f)break;try{const text=await f.read();await restoreFromText(f.name,text);}catch(err){toast("Error: "+err.message,"err");}break;}
  case"clear-all":{const ok=await askConfirm("Borrar todos los datos","Se eliminarán <b>todos</b> los vehículos, recargas, servicios, gastos y documentos.<br><span class='muted'>Te recomendamos guardar antes una copia.</span>","Borrar todo");if(!ok)return;state=clone(DEFAULT_STATE);pageState={fuel:1,services:1,expenses:1,documents:1};stateLoaded=true;await saveState();render();toast("Todos los datos han sido borrados","ok");break;}
  case"install":{if(deferredInstall){deferredInstall.prompt();const res=await deferredInstall.userChoice;if(res.outcome==="accepted")toast("Instalando…","ok");deferredInstall=null;$("#installBtn").hidden=true;}break;}
}});
document.addEventListener("input",e=>{const el=e.target.closest("[data-search]");if(!el)return;const type=el.dataset.search;searchTerm[type]=el.value;pageState[type]=1;const host=document.getElementById("tableHost");if(host){host.innerHTML=renderListBody(type);host.scrollTop=0;}});
document.addEventListener("change",e=>{if(e.target.id==="vehicleSelect"){state.settings.vehicle=e.target.value;pageState={fuel:1,services:1,expenses:1,documents:1};saveState();render();}});
document.addEventListener("change",e=>{const fi=e.target.closest("input[type=file][data-filekey]");if(fi)handleFilePick(fi);});
$("#themeBtn").addEventListener("click",()=>{const order=["auto","light","dark"];const i=order.indexOf(state.settings.theme);state.settings.theme=order[(i+1)%order.length];saveState();applyTheme();toast("Tema: "+({auto:"automático",light:"claro",dark:"oscuro"})[state.settings.theme],"info",1600);});
$("#fab").addEventListener("click",()=>{const map={fuel:"fuel",services:"services",expenses:"expenses",documents:"documents"};openRecordForm(map[currentView]||"fuel");});
/* ============ CSV (dropzone) ============ */
document.addEventListener("click",e=>{if(e.target.closest("#dropzone"))$("#csvInput").click();});
document.addEventListener("change",e=>{if(e.target.id==="csvInput"&&e.target.files.length){handleCSVFiles(Array.from(e.target.files));e.target.value="";}});
document.addEventListener("dragover",e=>{const dz=e.target.closest("#dropzone");if(dz){e.preventDefault();dz.classList.add("over");}});
document.addEventListener("dragleave",e=>{const dz=e.target.closest("#dropzone");if(dz)dz.classList.remove("over");});
document.addEventListener("drop",e=>{const dz=e.target.closest("#dropzone");if(!dz)return;e.preventDefault();dz.classList.remove("over");const files=Array.from(e.dataTransfer.files).filter(f=>/\.csv$/i.test(f.name));if(!files.length){toast("Suelta archivos .csv","err");return;}handleCSVFiles(files);});
/* ============ PWA ============ */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const btn=$("#installBtn");if(btn)btn.hidden=false;});
window.addEventListener("appinstalled",()=>{deferredInstall=null;const btn=$("#installBtn");if(btn)btn.hidden=true;toast("¡Aplicación instalada!","ok");});
const installBtn=$("#installBtn");
if(installBtn){installBtn.addEventListener("click",async()=>{if(deferredInstall){deferredInstall.prompt();const res=await deferredInstall.userChoice;if(res.outcome==="accepted")toast("Instalando…","ok");deferredInstall=null;installBtn.hidden=true;}else{openModal(`<div class="modal-head">${icon("install")}<h3>Instalar la aplicación</h3><button class="btn icon ghost" data-action="modal-close">${icon("close")}</button></div><div class="modal-body"><p style="margin-bottom:12px">Tu navegador no muestra el diálogo automático:</p><p style="margin-bottom:8px"><b>Chrome/Edge:</b> menú <kbd>⋮</kbd> → «Instalar aplicación».</p><p><b>Android:</b> menú <kbd>⋮</kbd> → «Añadir a pantalla de inicio».</p></div>`);}});}
/* ============ SW ============ */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{scope:"./"}).then(()=>console.log("[SW] ok")).catch(err=>console.warn("[SW] fallo:",err));});}
/* ============ INIT ============ */
async function init(){
  try{await openIDB();}catch(e){console.warn("IDB no disponible:",e);}
  try{state=await loadState();}catch(e){console.warn("loadState:",e);state=clone(DEFAULT_STATE);}
  stateLoaded=true;
  applyTheme();render();
  document.addEventListener("keydown",e=>{if(modalOpen)return;if(e.target.matches("input,textarea,select"))return;if(e.key==="n"&&!e.ctrlKey&&!e.metaKey){const map={fuel:"fuel",services:"services",expenses:"expenses",documents:"documents"};if(map[currentView]){e.preventDefault();openRecordForm(map[currentView]);}}});
  try{console.log("[FSBridge] backend:",FSBridge.backend());}catch(e){}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
</script>
</body>
</html>
